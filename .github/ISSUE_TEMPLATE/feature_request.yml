name: Feature request
description: Propose a focused user or integration improvement
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Xerify is a bounded cross-provider second-opinion primitive, not a recursive orchestrator or automatic merge authority. Explain the user problem before prescribing an implementation.
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What cannot be done safely or clearly today, and who encounters it?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior and a small example.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Primary surface
      options:
        - CLI
        - Library
        - MCP
        - Provider adapter
        - Configuration
        - Run history
        - Documentation
        - Packaging or installation
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and compatibility impact
      description: Note outbound data, credentials, provider identity, schema, exit-code, filesystem, or backward-compatibility implications.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Scope acknowledgement
      options:
        - label: I understand that opening a proposal does not guarantee acceptance or a delivery date.
          required: true
        - label: I searched existing issues and documentation for this request.
          required: true
