name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'assets/readme/xerify-verification-flow.gif'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The flow animation lives once, next to the renderer that produces it. Copying it in here
      # keeps the repository from carrying the same 597 KB twice.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp assets/readme/xerify-verification-flow.gif _site/
          cp assets/logos/icon-only/xerify-icon-32.svg _site/favicon.svg
          test -f _site/index.html
          test -f _site/xerify-verification-flow.gif
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
