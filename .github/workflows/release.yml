name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: npm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - id: release
        run: node scripts/verify-release-tag.mjs >> "$GITHUB_OUTPUT"
      - run: npm run check
      - run: npm run smoke:install
      - run: npm run release:audit
      - run: npm pack --pack-destination artifacts --ignore-scripts
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ steps.release.outputs.tarball }}
          sbom-path: artifacts/xerify.spdx.json
      # Bootstrap only: npm requires the package to exist before Trusted Publishing can be
      # configured. Remove NODE_AUTH_TOKEN after xverify-cli@0.1.0 is published and release.yml is
      # registered as the package's trusted publisher.
      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "${{ steps.release.outputs.tarball }}" --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "${{ steps.release.outputs.tarball }}"
          artifacts/xerify.spdx.json
          artifacts/production-licenses.json
          artifacts/npm-pack-audit.json
          --verify-tag
          --generate-notes
