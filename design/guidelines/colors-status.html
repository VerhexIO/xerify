<!-- @dsCard group="Colors" viewport="700x150" subtitle="Verdict states used in CLI/MCP output" name="Status Colors" -->
<link rel="stylesheet" href="../styles.css" />
<div
  style="
    display: flex;
    gap: 12px;
    height: 150px;
    align-items: center;
    padding: 0 16px;
    font-family: var(--font-sans);
  "
>
  <div
    style="
      flex: 1;
      background: var(--status-confirmed-bg);
      color: var(--status-confirmed-fg);
      border-radius: var(--radius-md);
      padding: 16px;
      text-align: center;
      font-weight: 600;
    "
  >
    CONFIRMED
    <div style="font-family: var(--font-mono); font-size: 12px; font-weight: 400; margin-top: 4px">
      exit 0
    </div>
  </div>
  <div
    style="
      flex: 1;
      background: var(--status-refuted-bg);
      color: var(--status-refuted-fg);
      border-radius: var(--radius-md);
      padding: 16px;
      text-align: center;
      font-weight: 600;
    "
  >
    REFUTED
    <div style="font-family: var(--font-mono); font-size: 12px; font-weight: 400; margin-top: 4px">
      exit 10
    </div>
  </div>
  <div
    style="
      flex: 1;
      background: var(--status-unclear-bg);
      color: var(--status-unclear-fg);
      border-radius: var(--radius-md);
      padding: 16px;
      text-align: center;
      font-weight: 600;
    "
  >
    UNCLEAR
    <div style="font-family: var(--font-mono); font-size: 12px; font-weight: 400; margin-top: 4px">
      exit 11
    </div>
  </div>
</div>
