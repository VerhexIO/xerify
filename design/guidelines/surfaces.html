<!-- @dsCard group="Spacing" viewport="700x180" subtitle="Radius 2-4px, 1px hairline borders, near-flat elevation" name="Surfaces" -->
<link rel="stylesheet" href="../styles.css" />
<div
  style="
    display: flex;
    gap: 20px;
    padding: 28px;
    background: var(--surface-sunken);
    font-family: var(--font-sans);
  "
>
  <div
    style="
      flex: 1;
      background: #fff;
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      padding: 20px;
    "
  >
    <div
      style="
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-secondary);
      "
    >
      Hairline
    </div>
    <div style="font-size: 13px; color: var(--text-secondary); margin-top: 8px">
      1px border, radius 4px, no shadow
    </div>
  </div>
  <div
    style="
      flex: 1;
      background: #fff;
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      padding: 20px;
      box-shadow: var(--shadow-md);
    "
  >
    <div
      style="
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-secondary);
      "
    >
      Raised
    </div>
    <div style="font-size: 13px; color: var(--text-secondary); margin-top: 8px">
      shadow-md, used sparingly
    </div>
  </div>
  <div
    style="
      flex: 1;
      background: var(--surface-panel-2);
      border: 1px solid var(--border-panel);
      border-radius: var(--radius-md);
      padding: 20px;
    "
  >
    <div
      style="
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-inverse-muted);
      "
    >
      Panel
    </div>
    <div style="font-size: 13px; color: #e8e8ed; margin-top: 8px">terminal / code surfaces</div>
  </div>
</div>
